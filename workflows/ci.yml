# Файл: .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"] # Используйте вашу версию Python

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        # Установка зависимостей для конкретного модуля
        if [ -f 06-best-practices/requirements.txt ]; then pip install -r 06-best-practices/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Останавливаем сборку при наличии ошибок Python, но позволяем продолжить при предупреждениях
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Полный отчет, но без остановки сборки
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        pytest 06-best-practices/