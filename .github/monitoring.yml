# .github/workflows/monitoring.yml
# This workflow runs on a schedule to generate a data drift report.

name: Scheduled Model Monitoring

on:
  schedule:
    # Run every day at 1:00 AM UTC
    - cron: '0 1 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r 07-project/requirements.txt
      
      # --- This is the key part of the workflow ---
      - name: Simulate Production Environment
        run: |
          # 1. Run data processing to ensure data/processed exists and is up-to-date
          python 07-project/src/data_processing.py

          # 2. Create a "fake" prediction log from the validation data
          # This script converts X_val.pkl into the predictions.log format
          python -c "import pandas as pd; df = pd.read_pickle('07-project/data/processed/X_val.pkl'); df.to_json('07-project/logs/predictions.log', orient='records', lines=True)"
      
      - name: Generate Drift Report
        run: |
          # Create the directory for the report output
          mkdir -p reports
          
          # Run your existing monitoring script. It will find all the files it needs.
          # Note: We create a dummy main() function to call your generate_drift_report
          python -c "from src.monitoring import generate_drift_report; generate_drift_report('07-project/data/processed/X_train.pkl', '07-project/logs/predictions.log', 'reports/drift_report.html')"
      
      - name: Upload Report Artifact
        uses: actions/upload-artifact@v3
        with:
          name: data-drift-report
          path: reports/drift_report.html