# .github/workflows/cd.yml (Corrected)
name: Continuous Delivery - Train Model

on:
  push:
    branches: [ main ]

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        # This path is correct because it's relative to the repo root
        run: pip install -r 07-project/requirements.txt
      
      - name: Run training pipeline
        # CORRECTED: Set working directory and run as a module
        working-directory: ./07-project
        run: python -m src.orchestrate