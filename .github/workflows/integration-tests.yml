# Название пайплайна
name: Manual - AWS Integration Test

# Триггеры запуска
on:
  # Позволяет запускать этот пайплайн вручную со страницы "Actions"
  workflow_dispatch:
    # Определяем параметры, которые можно будет ввести в UI
    inputs:
      year:
        description: 'Year for the test data (e.g., 2023)'
        required: true
        default: '2023'
      month:
        description: 'Month for the test data (e.g., 1 for January)'
        required: true
        default: '1'

jobs:
  # Название задачи
  run-aws-integration-test:
    runs-on: ubuntu-latest

    # Передаем секреты и параметры из UI в переменные окружения
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      # Передаем параметры из inputs в переменные окружения
      YEAR: ${{ github.event.inputs.year }}
      MONTH: ${{ github.event.inputs.month }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f 06-best-practices/requirements.txt ]; then
            pip install -r 06-best-practices/requirements.txt
          fi
      
      - name: Run the integration test script
        run: |
          python 06-best-practices/run_integration_test.py