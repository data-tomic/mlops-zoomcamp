name: Python Code Quality CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install flake8
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 .

  test-modules:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Теперь матрица имеет смысл: мы проверяем несколько модулей
        module: ['01-intro', '02-experiment-tracking', '04-deployment', '06-best-practices']

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies for ${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          if [ -f ${{ matrix.module }}/requirements.txt ]; then
            pip install -r ${{ matrix.module }}/requirements.txt
          fi
      
      - name: Test with pytest for ${{ matrix.module }}
        # Этот шаг будет выполнен, только если папка tests/ существует
        if: hashFiles(format('{0}/tests/**', matrix.module)) != ''
        run: |
          pytest ${{ matrix.module }}/tests/