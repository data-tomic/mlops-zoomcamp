name: Python Code Quality CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # ... шаги для линтера остаются без изменений ...
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install flake8
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 .

  test-modules:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Мы можем вернуть сюда все модули, т.к. тесты будут запускаться
        # только для тех, у кого есть папка tests/
        module: ['02-experiment-tracking', '03-orchestration', '04-deployment', '05-monitoring', '06-best-practices'] 
        # (оставим пока один для скорости отладки)

    # Мы пока уберем этот блок, так как юнит-тестам он не нужен.
    # Он понадобится, если мы решим запускать интеграционные тесты в CI.
    # env:
    #   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #   AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies for ${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          if [ -f ${{ matrix.module }}/requirements.txt ]; then
            pip install -r ${{ matrix.module }}/requirements.txt
          fi
      - name: Install pytest
        run: pip install pytest
        
      # --- ИЗМЕНЕННАЯ КОМАНДА ---
      - name: Test with pytest for ${{ matrix.module }}
        # Запускаем pytest и указываем ему конкретную папку с юнит-тестами
        run: pytest ${{ matrix.module }}/tests/