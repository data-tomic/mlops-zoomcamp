name: Python Code Quality CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install flake8
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 .

  test-modules:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # --- THIS IS THE CHANGE ---
        # Add your project to the list of modules to be tested.
        module: ['01-intro', '02-experiment-tracking', '04-deployment', '06-best-practices', '07-project']
        # ------------------------
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies for ${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          if [ -f ${{ matrix.module }}/requirements.txt ]; then
            pip install -r ${{ matrix.module }}/requirements.txt
          fi
      
      - name: Test with pytest for ${{ matrix.module }}
        # This step will now run for '07-project' because the tests/ directory exists
        if: hashFiles(format('{0}/tests/**', matrix.module)) != ''
        run: |
          PYTHONPATH=${{ matrix.module }} pytest ${{ matrix.module }}/tests/
